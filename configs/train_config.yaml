data:
  dataset: bloodmnist
  download_root: data
  batch_size: 256
  num_workers: 4
  n_channels: 3
  download: true
  augmentation:
    random_horizontal_flip: true
    random_rotation: 10
    # color_jitter:
    #   brightness: 0.2
    #   contrast: 0.2
    #   saturation: 0.2
    #   hue: 0.1    

model:
  name: resnet18   # simple_cnn or resnet18
  pretrained: true # use true for resnet18
  weights_dir: weights # directory to store pretrained weights if pretrained is true
  

training:
  epochs: 20
  lr: 0.0005
  weight_decay: 0.0001
  log_dir: logs
  device: auto
