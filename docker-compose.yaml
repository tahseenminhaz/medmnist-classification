services:
  train:
    build: .
    command: python scripts/train.py
    volumes:
      - ./configs:/workspace/configs
      - ./logs:/workspace/logs
      - ./data:/workspace/data
      - ./weights:/workspace/weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  evaluate:
    build: .
    command: python scripts/evaluate.py
    volumes:
      - ./configs:/workspace/configs
      - ./logs:/workspace/logs
      - ./data:/workspace/data
      - ./weights:/workspace/weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  serve:
    build: .
    command: python scripts/serve.py
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/workspace/configs
      - ./logs:/workspace/logs
      - ./data:/workspace/data
      - ./weights:/workspace/weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]